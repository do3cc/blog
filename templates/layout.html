<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Welcome{% endblock %} — do3cc</title>
    <link rel="stylesheet" href="{{ '/static/style.css'|url }}">
    <link rel="stylesheet" href="{{ get_pygments_stylesheet()|url }}">
    <link href="/feed.xml" type="application/atom+xml" rel="alternate" title="Sitewide ATOM Feed">
    <link href="/blog/category/plone/feed/atom/index.xml" type="application/atom+xml" rel="alternate" title="Plone ATOM Feed">
</head>
<body>
    <header>
        <div class="wrap">
            <p class="site-title"><a href="{{ '/'|url }}">Translator</a></p>
            <p class="tagline">Human → Computer</p>
            <nav aria-label="Main">
                <ul>
                    <li{% if this._path == '/' %} class="active"{% endif %}><a href="{{ '/'|url }}">Welcome</a></li>
                    {# Presentations are outdated: unlinked, but still online under /presentations/ #}
                    {% for href, title in [
                        ['/blog', 'Blog'],
                        ['/about', 'About']
                    ] %}
                    <li{% if this.is_child_of(href, strict=False) %} class="active"{% endif %}><a href="{{ href|url }}">{{ title }}</a></li>
                    {% endfor %}
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="wrap">
            {% block body %}{% endblock %}
        </div>
    </main>
    <footer>
        <div class="wrap">
            <span><a href="{{ '/site.html'|url }}">Impressum</a></span>
            <span><a href="/feed.xml">Atom feed</a></span>
        </div>
    </footer>
    <script>
        if (document.querySelector("pre.mermaid")) {
            const script = document.createElement("script");
            script.src = "{{ '/static/mermaid/mermaid.min.js'|url }}";
            script.onload = () => {
                mermaid.initialize({ startOnLoad: false });
                mermaid.run();
            };
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
