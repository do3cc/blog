name: Build all files to test building python
on: [push]
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.14"
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
            - name: Install dependencies
              run: |
                  uv sync --locked
                  cd webpack
                  npm ci
            - name: Check imprint
              run: python3 scripts/check_imprint.py
            - name: Build
              run: |
                  uv run --locked lektor build -f webpack
