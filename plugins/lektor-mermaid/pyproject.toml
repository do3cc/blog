[project]
name = "lektor-mermaid"
version = "0.1.0"
description = "Render ```mermaid markdown fences for mermaid.js"
requires-python = ">=3.11"
dependencies = ["lektor>=3.3.11"]

[project.entry-points."lektor.plugins"]
mermaid = "lektor_mermaid:MermaidPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["lektor_mermaid.py"]
