[model]
name = Blog
label = Blog
hidden = yes

[children]
model = blog-post
order_by = -pub_date, title
slug_format = {{ (this.pub_date|dateformat('YYYY/MM/DD/') if this.pub_date) ~ (this._id[11:] if this._id[4:5] == '-' and this._id[7:8] == '-' and this._id[10:11] == '-' else this._id) }}

[pagination]
enabled = yes
per_page = 10
